<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beam LNA test</title>
  </head>
  <body style="font-family: system-ui; background: #111; color: #eee; padding: 40px">
    <h1>Local network WebSocket test</h1>
    <p>This page checks whether a main-thread <code>ws://</code> connection to a private IP is allowed from HTTPS.</p>
    <button id="go" style="font-size: 20px; padding: 12px 20px">Connect</button>
    <pre id="out" style="white-space: pre-wrap"></pre>
    <script>
      const out = (text) => {
        document.getElementById("out").textContent += text + "\n";
      };
      document.getElementById("go").addEventListener("click", () => {
        const target = new URLSearchParams(location.search).get("tv") || "10.10.2.230:18447";
        out("connecting ws://" + target + "/ws");
        const ws = new WebSocket("ws://" + target + "/ws");
        ws.onopen = () => {
          out("open");
          ws.send(JSON.stringify({ type: "hello", name: "LNA test", ua: navigator.userAgent }));
        };
        ws.onmessage = (event) => out("message " + event.data);
        ws.onerror = () => out("error");
        ws.onclose = (event) => out("close " + event.code + " " + event.reason);
      });
    </script>
  </body>
</html>
